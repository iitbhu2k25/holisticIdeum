  #   restart: always
  #   depends_on:
  #     - backend

 
  backend:
    build:
      context: ./backend/
      dockerfile: docker/dockerfile.backend
    image: backend:latest
    ports:
      - "9000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/home/app:z
    command: >
      /bin/sh -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
      "
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      geoserver:
        condition: service_started

  database:
    image: postgres:16
    ports:
      - "5450:5432"
    env_file:
      - ./database/.db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  geoserver:
    image: kartoza/geoserver:2.28.0
    ports:
      - "9090:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      # the one shared media folder
      - ./backend/media:/opt/geoserver/medias
    environment:
      ENABLE_CORS: "true"
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,https://*.slcrdss.in,https://*.slcrdss.xyz,https://*.trycloudflare.com,https://holistic-ideum.vercel.app,https://*.vercel.app
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,HEAD,OPTIONS
      CORS_ALLOWED_HEADERS: "*"
      TOMCAT_EXTRAS: "true"
      HTTP_MAX_HEADER_SIZE: 33554432
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_DATA_DIR: /opt/geoserver/data_dir
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml --url http://backend:8000
    configs:
      - source: cloudflared
        target: /etc/cloudflared/config.yml
    depends_on:
      - backend
      - geoserver
    restart: always

  # Writes the current quick-tunnel URL to frontend/tunnel.json
  # (and when GITHUB_TOKEN is set in environment, commits & pushes it).
  tunnel_url:
    image: docker:27-cli
    entrypoint: ["sh", "-c", "command -v git >/dev/null || timeout 60 apk add --no-cache -q git; exec sh /repo/update-tunnel-url.sh"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_OWNER: ${LOG_OWNER:-1000:1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/repo
    depends_on:
      - cloudflared
    restart: always

configs:
  cloudflared:
    content: |
      ingress:
        - path: ^/geoserver(/.*)?$$
          service: http://geoserver:8080
        - service: http://backend:8000

volumes:
  postgres_data:
  geoserver_data:
  redis_data:
